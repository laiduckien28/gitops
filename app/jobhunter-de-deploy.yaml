---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobhunter-fe
  namespace: ac-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobhunter-fe
  template:
    metadata:
      labels:
        app: jobhunter-fe
    spec:
      hostAliases:
      - ip: "10.40.1.138"
        hostnames:
        - "registry.fis.local"
      containers:
        - name: jobhunter-fe
          image: kienld/fe:v3
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: jobhunter-fe
  namespace: ac-dev
spec:
  selector:
    app: jobhunter-fe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobhunter-fe
  namespace: ac-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobhunter-fe
  template:
    metadata:
      labels:
        app: jobhunter-fe
    spec:
      containers:
        - name: jobhunter-fe
          image: registry.fis.local/public-repo:latest   # Tekton build push lên
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: jobhunter-fe
  namespace: ac-dev
spec:
  selector:
    app: jobhunter-fe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
